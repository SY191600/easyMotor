[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easyMotor"
version = "0.2.0"
authors = [
  { name="sunyun", email="1512258082@qq.com" }
]
description = "永磁电机电磁力时空阶次分析工具"
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21",
  "matplotlib>=3.5",
  "pandas>=1.3",
  "scipy">= 1.18.0
]

[project.urls]
"Homepage" = "https://github.com/SY191600/easyMotor"
"Bug Tracker" = "https://github.com/SY191600/easyMotor/issues"